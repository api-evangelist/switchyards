name: Switchyards
description: Switchyards is a membership-based neighborhood work club — a 24/7 network of
  coffee-shop-style workspaces built for focused solo work close to where members live. Each
  club pairs a bustling cafe with quiet library spaces for deep work, plus bookable phone
  booths and meeting rooms, free locally roasted coffee and organic tea, and fast internet.
  Membership runs about $100/month for unlimited access across all locations, and the company
  is expanding from its Atlanta roots into neighborhoods across the Southeast and beyond.
  Switchyards is backed by Bullpen Capital and does not publish a public developer API.
